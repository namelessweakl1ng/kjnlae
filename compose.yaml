services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KJNLAE_ENV: ${KJNLAE_ENV:-development}
      KJNLAE_API_KEY: ${KJNLAE_API_KEY:-}
      KJNLAE_DATABASE: /app/var/audit.db
      KJNLAE_ALLOWED_HOSTS: ${KJNLAE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      KJNLAE_RETENTION: ${KJNLAE_RETENTION:-500}
      KJNLAE_RATE_LIMIT: ${KJNLAE_RATE_LIMIT:-60}
      KJNLAE_MODEL_DIR: /app/model
      KJNLAE_MODEL_HASH: ${KJNLAE_MODEL_HASH:-}
    volumes:
      - audit:/app/var
      - ${KJNLAE_MODEL_DIR_HOST:-./var/models/full-v0.2-v3-600/best}:/app/model:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 4
    mem_limit: 4g
    pids_limit: 128
volumes:
  audit:
