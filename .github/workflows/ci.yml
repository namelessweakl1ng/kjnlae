name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && mypy src
      - run: pytest
      - run: pip-audit -r requirements.lock
      - run: kjnlae benchmark --output reports/benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: measured-fixture-benchmark
          path: reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build
      - run: npm audit --audit-level=low
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs && docker compose down
