
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Install built wheel in a clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/kjnlae-*.whl
          .wheel-smoke/bin/python -m pip check
      - name: Check required CPU and model-download dependencies
        run: |
          .wheel-smoke/bin/python - <<'PY'
          from importlib import metadata

          import kjnlae
          import huggingface_hub
          import onnx
          import onnxruntime
          import safetensors
          import tokenizers

          requirements = metadata.requires("kjnlae") or []
          assert any(
              requirement.lower().replace("_", "-").startswith("huggingface-hub")
              for requirement in requirements
          ), "Built wheel does not declare huggingface-hub"
          assert metadata.version("kjnlae") == kjnlae.__version__
          print("Installed wheel and its required dependency imports are available")
          PY
          .wheel-smoke/bin/kjnlae model download --help

  publish:
    needs: [build, wheel-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
